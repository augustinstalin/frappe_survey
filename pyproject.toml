[project]
name = "survey"
authors = [
    { name = "Bosco Soft Technologies", email = "augustinstalin@boscosofttech.com"},
]
description = "Surveys, assessments and certifications for Frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Frappe itself is provided by the bench; do not pin it here.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", # assertRaises(Exception)
    "B023", # function definition does not bind loop variable
    "B904", # raise without from inside except
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "F401", # imported but unused
    "F403", # star imports
    "W191", # indentation contains tabs
    "RUF001", # ambiguous characters
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
